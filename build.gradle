plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.influencers'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		implementation 'org.springframework.boot:spring-boot-starter-web'
		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-security'

		implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.2'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.2'
	implementation 'org.apache.commons:commons-csv:1.10.0'

	implementation 'com.stripe:stripe-java:20.92.0'
	//implementation 'io.jsonwebtoken:jjwt:0.9.1'

	//	implementation 'io.jsonwebtoken:jjwt:0.11.5' // JWT for authentication
		implementation 'org.springframework.boot:spring-boot-starter-actuator' // For monitoring
		implementation 'org.postgresql:postgresql' // PostgreSQL driver
		//implementation 'org.springframework.boot:spring-boot-starter-thymeleaf' // Optional (for templates)
	implementation 'org.springframework.boot:spring-boot-starter-mail'
		// Lombok (Reduces Boilerplate)
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'


		// DevTools (Hot Reload)
		developmentOnly 'org.springframework.boot:spring-boot-devtools'

		// Testing
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testImplementation 'org.springframework.security:spring-security-test'

}

tasks.named('test') {
	useJUnitPlatform()
}
